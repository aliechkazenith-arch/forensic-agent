[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensicops-ai"
version = "0.1.0"
description = "ForensicOps AI - Local-first, modular, workflow-driven cyber-forensics platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "duckdb",
    "httpx",
    "pyyaml",
    "langgraph",
    "pytest",
    "pytest-asyncio",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt",
    "python-multipart",
    "urllib3>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

